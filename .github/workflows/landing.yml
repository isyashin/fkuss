name: landing
on:
  push:
    paths: ["landing-prototype/**", ".github/workflows/landing.yml"]
  # На PR — без path-фильтра: проверка validate обязательна для мержа
  # в защищённый main и должна присутствовать в каждом PR.
  pull_request:
permissions:
  contents: read
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test landing-prototype/tests/*.test.mjs
      - run: python3 landing-prototype/tests/backup_test.py -v
      - run: docker build -t fkuss-landing:ci landing-prototype
      - name: Test the pinned runtime in isolation
        run: >
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 256m
          --tmpfs /tmp:rw,noexec,nosuid,size=32m
          -v "$PWD/landing-prototype/tests:/app/landing-prototype/tests:ro"
          fkuss-landing:ci node --test tests/render.test.mjs tests/server.test.mjs
