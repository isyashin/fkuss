<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf8f3">
  <title>fkuss.ru</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="assets/favicon.svg?v=1">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top"><img data-logo width="2172" height="724" alt="fkuss.ru"></a>
      <nav class="main-nav" id="navigation"></nav>
    </div>
  </header>
  <main id="top">
    <section class="hero section">
      <div class="container hero-layout">
        <div class="hero-copy">
          <p class="eyebrow" data-text="hero.eyebrow"></p>
          <h1 id="hero-heading"></h1>
          <p class="lead" data-text="hero.description"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#request-form" data-primary></a>
            <a class="text-link" href="#examples"><span data-text="hero.secondaryAction"></span><span aria-hidden="true">↗</span></a>
          </div>
          <p class="action-note" data-text="hero.note"></p>
          <ul class="hero-tags" id="hero-tags"></ul>
        </div>
        <div class="screen-stage">
          <a class="hero-screen browser-frame" id="hero-preview" target="_blank" rel="noopener noreferrer">
            <div class="browser-bar"><span class="browser-dots" aria-hidden="true"><i></i><i></i><i></i></span><span data-text="hero.preview.domain"></span><span class="browser-open" aria-hidden="true">↗</span></div>
            <img id="hero-screenshot" width="1265" height="712" fetchpriority="high">
          </a>
          <div class="floating-note"><span class="floating-icon" aria-hidden="true">↗</span><div><strong data-text="hero.preview.badgeTitle"></strong><span data-text="hero.preview.badgeText"></span></div></div>
          <p class="screen-caption" data-text="hero.preview.caption"></p>
        </div>
      </div>
    </section>

    <section class="examples section" id="examples" aria-labelledby="examples-heading">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-text="examples.eyebrow"></p>
          <h2 id="examples-heading" data-text="examples.heading"></h2>
          <p class="section-description" data-text="examples.description"></p>
        </div>
        <div class="examples-grid" id="examples-grid"></div>
      </div>
    </section>

    <section class="value section" id="value" aria-labelledby="value-heading">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-text="value.eyebrow"></p>
          <h2 id="value-heading" data-text="value.heading"></h2>
          <p class="section-description" data-text="value.description"></p>
        </div>
        <div class="scenario-grid" id="scenario-grid"></div>
        <p class="economics-note" data-text="value.economicsNote"></p>
      </div>
    </section>

    <section class="included section" id="included" aria-labelledby="included-heading">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-text="included.eyebrow"></p>
          <h2 id="included-heading" data-text="included.heading"></h2>
          <p class="section-description" data-text="included.description"></p>
        </div>
        <div class="features-grid" id="features-grid"></div>
        <div class="payment-note"><span class="payment-icon" aria-hidden="true"></span><div><strong data-text="included.payment.title"></strong><p data-text="included.payment.body"></p></div></div>
      </div>
    </section>

    <section class="research section" id="research" aria-labelledby="research-heading">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-text="research.eyebrow"></p>
          <h2 id="research-heading" data-text="research.heading"></h2>
          <p class="section-description" data-text="research.description"></p>
        </div>
        <div class="research-grid" id="research-grid"></div>
        <p class="research-note" data-text="research.note"></p>
      </div>
    </section>

    <section class="launch section" id="launch" aria-labelledby="launch-heading">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-text="launch.eyebrow"></p>
          <h2 id="launch-heading" data-text="launch.heading"></h2>
        </div>
        <ol class="launch-grid" id="launch-grid"></ol>
        <p class="launch-note"><span aria-hidden="true">↗</span><span data-text="launch.note"></span></p>
      </div>
    </section>

    <section class="request section" id="request" aria-labelledby="request-heading">
      <div class="container request-layout">
        <div class="request-copy">
          <p class="eyebrow" data-text="request.eyebrow"></p>
          <h2 id="request-heading" data-text="request.heading"></h2>
          <p class="section-description" data-text="request.description"></p>
          <ul class="reassurance-list" id="reassurance-list"></ul>
        </div>
        <form class="request-form" id="request-form" novalidate>
          <h3 data-text="request.formTitle"></h3>
          <div class="field">
            <label for="contact-name"><span data-text="request.nameLabel"></span><span class="optional" data-text="request.optional"></span></label>
            <input id="contact-name" name="contactName" type="text" autocomplete="name" maxlength="120" aria-describedby="contact-name-error">
            <p class="field-error" id="contact-name-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="phone" data-text="request.phoneLabel"></label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" required aria-describedby="phone-error">
            <p class="field-error" id="phone-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="restaurant"><span data-text="request.restaurantLabel"></span><span class="optional" data-text="request.optional"></span></label>
            <input id="restaurant" name="restaurant" type="text" autocomplete="organization" maxlength="120">
          </div>
          <div class="field">
            <label for="menu"><span data-text="request.menuLabel"></span><span class="optional" data-text="request.optional"></span></label>
            <input id="menu" name="menu" type="url" inputmode="url" autocomplete="url" maxlength="2048" aria-describedby="menu-hint menu-error">
            <p class="field-hint" id="menu-hint" data-text="request.menuHint"></p>
            <p class="field-error" id="menu-error" role="alert" hidden></p>
          </div>
          <div class="form-honeypot" aria-hidden="true"><label for="website">Ваш сайт</label><input id="website" name="website" type="text" autocomplete="off" tabindex="-1"></div>
          <p class="field-error" id="submit-error" role="alert" hidden></p>
          <button class="button button-primary form-submit" type="submit" disabled><span data-text="request.submit"></span><span aria-hidden="true">↗</span></button>
          <p class="form-note" data-text="request.footnote"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div><a class="brand footer-brand" href="#top"><img data-logo width="2172" height="724" alt="fkuss.ru"></a><p data-text="footer.copyright"></p></div>
      <p class="prototype-note" data-text="footer.prototype"></p>
      <a class="text-link" href="#top"><span data-text="footer.top"></span><span aria-hidden="true">↑</span></a>
    </div>
  </footer>

  <div class="mobile-action" id="mobile-action" hidden><a class="button button-primary" href="#request-form" data-primary></a></div>
  <dialog class="confirmation" id="confirmation" aria-labelledby="confirmation-title">
    <div class="confirmation-icon" aria-hidden="true">✓</div>
    <h2 id="confirmation-title" data-text="request.successTitle"></h2>
    <p data-text="request.successText"></p>
    <button class="button button-primary" id="close-confirmation" data-text="request.successClose"></button>
  </dialog>
  <noscript><p class="noscript-note">Для отправки заявки включите JavaScript.</p></noscript>
</body>
</html>
