services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://resto:${POSTGRES_PASSWORD:?задайте в .env}@db:5432/resto
    volumes:
      - ./content:/app/content
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в .env}
      POSTGRES_DB: resto
    # Порт наружу — ТОЛЬКО для разработки с хост-машины (dev-ВМ в LAN).
    # На проде убрать.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
