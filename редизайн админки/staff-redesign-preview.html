<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рабочая админка — макет</title>
  <style>
    :root {
      font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
      color: #202723;
      background: #fff;
      font-synthesis: none;
      --ink: #202723;
      --muted: #68716a;
      --line: #e2e4df;
      --nav: #202924;
      --nav-text: #bbc6bd;
      --rail: #f5f6f2;
      --soft: #f7f8f5;
      --accent: #ad573b;
      --accent-dark: #8f4029;
      --green: #30694a;
      --amber: #9a6423;
      --red: #a3473b;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .shell { display: grid; grid-template-columns: 174px minmax(0,1fr); min-height: 100vh; }
    .primary { position: sticky; top: 0; height: 100vh; padding: 28px 13px 20px; color: #fff; background: var(--nav); }
    .brand { display: flex; align-items: baseline; gap: 1px; padding: 1px 13px 40px; white-space: nowrap; }
    .brand strong { font: italic 27px Georgia, serif; letter-spacing: -.07em; }
    .brand i { color: #e29372; font: normal 29px Georgia, serif; }
    .global-nav { display: grid; gap: 4px; }
    .global-link { position: relative; width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 5px; background: transparent; color: var(--nav-text); text-align: left; text-decoration: none; font-size: 13px; font-weight: 520; }
    .global-link:hover { color: #fff; background: #ffffff12; }
    .global-link svg { flex: none; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .global-link[aria-current="page"] { color: #fff; background: #ffffff14; }
    .global-link[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: #dc8e6b; }
    .global-link em { min-width: 20px; height: 20px; display: grid; place-items: center; margin-left: auto; padding: 0 4px; border-radius: 10px; background: #a95038; color: #fff; font-size: 10px; font-style: normal; font-weight: 700; }
    .primary-rule { height: 1px; margin: 15px 12px; background: #ffffff1f; }
    .workspace { min-width: 0; }
    .mobile-top, .mobile-bottom { display: none; }
    .screen { min-height: 100vh; }
    .queue-layout { display: grid; grid-template-columns: minmax(340px,405px) minmax(0,1fr); min-height: 100vh; }
    .queue-pane { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--rail); scrollbar-width: thin; }
    .queue-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 38px 27px 25px; }
    .queue-head h1 { margin: 0; font-size: 29px; line-height: 1.15; font-weight: 620; letter-spacing: -.05em; }
    .tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
    .tabs button { position: relative; flex: none; min-height: 48px; padding: 0 11px; border: 0; background: transparent; color: #68766b; font-size: 12.5px; font-weight: 560; }
    .tabs button:hover { color: var(--ink); }
    .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; }
    .tabs button[aria-selected="true"]::after { content: ""; position: absolute; right: 9px; bottom: -1px; left: 9px; height: 2px; background: var(--accent); }
    .tabs span { margin-left: 3px; color: #88928a; font-size: 11px; font-weight: 500; }
    .queue-tools { display: grid; grid-template-columns: minmax(0,1fr) 132px; gap: 8px; padding: 19px 27px 16px; }
    .queue-tools.single { grid-template-columns: minmax(0,1fr); }
    .search, select, .field input, .field textarea { width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; border: 1px solid #cdd3cc; border-radius: 6px; background: #fff; color: var(--ink); font-size: 13px; }
    .search::placeholder, .field input::placeholder, .field textarea::placeholder { color: #9aa39a; }
    .queue-tools select { padding-right: 27px; }
    .queue-list { padding-bottom: 24px; }
    .queue-row { width: 100%; min-height: 103px; display: grid; gap: 6px; padding: 18px 27px 18px 24px; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; background: transparent; color: var(--ink); text-align: left; }
    .queue-row:hover { background: #eef1ec; }
    .queue-row[aria-current="true"] { border-left-color: var(--accent); background: #fff; }
    .queue-row:disabled { opacity: 1; cursor: default; }
    .queue-row:disabled:hover { background: transparent; }
    .queue-row[aria-current="true"]:disabled:hover { background: #fff; }
    .row-top, .row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
    .row-top strong { font-size: 13.5px; font-weight: 680; }
    .row-top time, .row-bottom { color: var(--muted); font-size: 12px; }
    .row-top time { margin-left: 6px; font-weight: 450; }
    .row-person { overflow: hidden; font-size: 14px; font-weight: 590; text-overflow: ellipsis; white-space: nowrap; }
    .row-bottom span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-bottom b { flex: none; color: #3a463d; font-weight: 650; white-space: nowrap; }
    .day-divider { padding: 17px 27px 8px; color: #77847a; font-size: 11px; font-weight: 700; letter-spacing: .045em; text-transform: uppercase; }
    #screen-bookings .queue-row { min-height: 88px; }
    .status { display: inline-flex; align-items: center; gap: 6px; min-height: 25px; padding: 3px 8px; border-radius: 4px; background: #ebefea; color: #47614d; font-size: 11px; line-height: 1.15; font-weight: 660; white-space: nowrap; }
    .status::before { content: ""; width: 6px; height: 6px; flex: none; border-radius: 50%; background: currentColor; }
    .status[data-tone="new"] { background: #f9e9df; color: #a64d32; }
    .status[data-tone="working"] { background: #f4eddc; color: #916322; }
    .status[data-tone="ready"], .status[data-tone="done"] { background: #e7eee7; color: #376749; }
    .status[data-tone="off"] { background: #f2ebe9; color: #9a5146; }
    .status[data-tone="source"] { background: #eef0eb; color: #657064; }
    .detail-pane { min-width: 0; background: #fff; }
    .detail-inner { max-width: 880px; margin: 0 auto; padding: 55px clamp(32px,5vw,72px) 90px; }
    .back-button { display: none; }
    .detail-head { padding-bottom: 25px; border-bottom: 1px solid var(--line); }
    .detail-title { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 15px; }
    .detail-title h2 { margin: 0; font-size: clamp(26px,2.7vw,34px); line-height: 1.15; font-weight: 620; letter-spacing: -.05em; }
    .detail-subtitle { margin: 9px 0 0; color: var(--muted); font-size: 12.5px; }
    .detail-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 25px; }
    .primary-button, .secondary-button, .text-button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 17px; border: 1px solid #cbd1ca; border-radius: 6px; background: #fff; color: #344039; text-decoration: none; font-size: 12.5px; font-weight: 650; }
    .primary-button { border-color: var(--accent); background: var(--accent); color: #fff; }
    .primary-button:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
    .secondary-button:hover { border-color: #89978c; background: #f7f9f6; }
    .text-button { padding-inline: 9px; border-color: transparent; background: transparent; color: #617065; }
    .text-button:hover { background: var(--soft); color: var(--ink); }
    .text-button.danger { color: var(--red); }
    .detail-section { padding: 29px 0; border-bottom: 1px solid var(--line); }
    .detail-section:last-child { border-bottom: 0; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 18px; }
    .section-title h3 { margin: 0; font-size: 15px; font-weight: 680; letter-spacing: -.015em; }
    .contact-name { margin: 0 0 11px; font-size: 19px; font-weight: 610; letter-spacing: -.025em; }
    .contact-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .contact-actions a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 13px; border: 1px solid var(--line); border-radius: 6px; color: #39493d; text-decoration: none; font-size: 12.5px; font-weight: 600; }
    .contact-actions a:hover { background: var(--soft); }
    .facts { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 19px 24px; }
    .fact { min-width: 0; display: grid; align-content: start; gap: 5px; }
    .fact span { color: #7b887c; font-size: 11.5px; }
    .fact strong { overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.45; font-weight: 590; }
    .note { margin: 17px 0 0; padding: 13px 15px; border-left: 2px solid #d5aa76; background: #fbf8f2; color: #594e3e; font-size: 12.5px; line-height: 1.5; }
    .item-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 18px; padding: 13px 0; border-bottom: 1px solid #edf0eb; font-size: 13px; }
    .item-row:last-child { border-bottom: 0; }
    .item-row strong { font-weight: 590; }
    .item-row small { grid-column: 1; color: var(--muted); font-size: 11.5px; }
    .item-row b { grid-column: 2; grid-row: 1/3; align-self: center; font-weight: 650; white-space: nowrap; }
    .sum-lines { display: grid; gap: 10px; margin-top: 22px; padding-top: 17px; border-top: 1px solid var(--line); }
    .sum-line { display: flex; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 12.5px; }
    .sum-line b { color: var(--ink); font-weight: 600; }
    .sum-line.total { color: var(--ink); font-size: 17px; font-weight: 650; }
    .sum-line.total b { font-weight: 700; }
    .empty { padding: 28px 27px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .edit-line { display: grid; grid-template-columns: minmax(0,1fr) 124px auto; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .edit-line strong { font-size: 13px; font-weight: 610; }
    .edit-line small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .quantity { display: grid; grid-template-columns: 44px 36px 44px; align-items: center; }
    .quantity button { min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 17px; }
    .quantity span { text-align: center; font-size: 13px; }
    .field { min-width: 0; display: grid; gap: 7px; color: #3b473f; font-size: 12.5px; font-weight: 610; }
    .field textarea { min-height: 87px; resize: vertical; line-height: 1.5; }
    .field small, .form-note { color: var(--muted); font-size: 11.5px; line-height: 1.5; font-weight: 400; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .full { grid-column: 1/-1; }
    .add-line { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; margin-top: 18px; }
    .add-line select { min-height: 44px; }
    .preview-total { display: flex; justify-content: space-between; margin: 22px 0 6px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 15px; font-weight: 650; }
    .menu-layout { display: grid; grid-template-columns: minmax(340px,405px) minmax(0,1fr); min-height: 100vh; }
    .menu-list-pane .queue-head { align-items: center; }
    .menu-list-pane .queue-head .primary-button { flex: none; padding-inline: 13px; }
    .menu-tools { display: grid; gap: 10px; padding: 0 27px 17px; }
    .menu-filter-row { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .menu-filter-row select { min-width: 0; }
    .category-add { width: max-content; padding-left: 0; border: 0; background: transparent; color: #58695b; }
    .menu-row { width: 100%; min-height: 78px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 3px 13px; padding: 14px 27px 14px 24px; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; background: transparent; color: var(--ink); text-align: left; }
    .menu-row.has-photo { min-height: 91px; grid-template-columns: 54px minmax(0,1fr) auto; }
    .menu-row:hover { background: #eef1ec; }
    .menu-row[aria-current="true"] { border-left-color: var(--accent); background: #fff; }
    .menu-row:disabled { opacity: 1; cursor: default; }
    .menu-row .dish-photo { grid-row: 1/3; }
    .menu-row .dish-copy { align-self: end; }
    .menu-row .dish-price { align-self: end; }
    .menu-row .status { grid-column: 1/3; justify-self: start; align-self: start; margin-top: 3px; }
    .menu-row.has-photo .status { grid-column: 2/4; }
    .dish-photo { width: 56px; height: 56px; display: block; overflow: hidden; border: 1px solid #e7e9e3; border-radius: 5px; background: #eceee9; }
    .dish-photo img { width: 100%; height: 100%; object-fit: cover; }
    .dish-photo.empty { display: grid; place-items: center; border-style: dashed; color: #78857a; font-size: 11px; }
    .dish-copy { min-width: 0; }
    .dish-copy strong { display: block; overflow: hidden; font-size: 13.5px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .dish-copy small { display: block; overflow: hidden; margin-top: 5px; color: var(--muted); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; }
    .dish-price { font-size: 13px; font-weight: 650; white-space: nowrap; }
    .menu-detail-inner { max-width: 820px; }
    .menu-detail-inner .detail-head { padding-bottom: 23px; }
    .menu-detail-inner .detail-subtitle { margin-top: 10px; }
    .menu-editor { display: grid; gap: 25px; }
    .photo-control { display: flex; align-items: center; gap: 17px; padding: 24px 0; border-bottom: 1px solid var(--line); }
    .photo-control .dish-photo { width: 86px; height: 86px; flex: none; }
    .photo-control .form-note { display: block; margin-top: 7px; }
    .menu-fields { display: grid; gap: 20px; padding-bottom: 28px; }
    .menu-fields .field { font-size: 13px; }
    .menu-fields .field input, .menu-fields .field select, .menu-fields .field textarea { font-size: 14px; }
    .menu-fields .field input[readonly] { background: #f4f6f2; color: #59665d; }
    .menu-price-row { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .menu-savebar { position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 calc(-1 * clamp(32px,5vw,72px)); padding: 13px clamp(32px,5vw,72px); border-top: 1px solid var(--line); background: #fffffff2; }
    .menu-savebar span { color: #81512c; font-size: 12px; font-weight: 620; }
    .menu-savebar div { display: flex; gap: 8px; }
    .menu-delete { justify-self: start; margin: 8px 0 0 -9px; }
    .menu-status-action { margin-top: 20px; }
    .file-button { position: relative; width: max-content; }
    .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .file-button:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
    dialog { padding: 0; border: 0; border-radius: 8px; box-shadow: 0 18px 65px #17221b33; color: var(--ink); }
    dialog::backdrop { background: #17241d77; }
    .confirm-dialog { width: min(410px,calc(100vw - 32px)); padding: 26px; }
    .confirm-dialog h2 { margin: 0 0 10px; font-size: 19px; }
    .confirm-dialog p { margin: 0 0 23px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 9px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 40; max-width: 350px; padding: 13px 17px; border-radius: 6px; background: var(--nav); color: #fff; box-shadow: 0 8px 26px #1d281d2b; font-size: 12.5px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
    .toast.show { opacity: 1; transform: none; }
    @media (max-width: 1160px) {
      .shell { grid-template-columns: 70px minmax(0,1fr); }
      .primary { padding-inline: 8px; }
      .brand { justify-content: center; padding-inline: 0; }
      .brand strong { font-size: 0; }
      .brand strong::before { content: "ф"; font: italic 29px Georgia,serif; }
      .brand i { font-size: 24px; }
      .global-link { justify-content: center; padding: 0; }
      .global-link span { display: none; }
      .global-link em { position: absolute; top: 3px; right: 1px; min-width: 16px; height: 16px; font-size: 9px; }
    }
    @media (max-width: 970px) {
      .queue-layout { grid-template-columns: minmax(300px,350px) minmax(0,1fr); }
      .detail-inner { padding-inline: 29px; }
      .menu-layout { grid-template-columns: minmax(300px,350px) minmax(0,1fr); }
      .menu-savebar { margin-inline: -29px; padding-inline: 29px; }
    }
    @media (min-width: 761px) and (max-width: 900px) {
      .menu-price-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .shell { display: block; }
      .primary { display: none; }
      .mobile-top { display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 20px; border-bottom: 1px solid var(--line); }
      .mobile-top strong { font: italic 23px Georgia,serif; letter-spacing: -.07em; }
      .mobile-top i { color: var(--accent); font: normal 24px Georgia,serif; }
      .mobile-top small { color: #8b958b; font-size: 11px; }
      .mobile-bottom { position: fixed; right: 0; bottom: 0; left: 0; z-index: 25; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); min-height: 64px; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--line); background: #fff; }
      .mobile-link { position: relative; display: grid; place-content: center; justify-items: center; gap: 3px; min-height: 64px; border: 0; background: transparent; color: #78847a; text-decoration: none; font-size: 10px; }
      .mobile-link svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .mobile-link[aria-current="page"] { color: var(--accent); font-weight: 700; }
      .mobile-link em { position: absolute; top: 4px; left: calc(50% + 9px); min-width: 16px; height: 16px; display: grid; place-items: center; padding: 0 3px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 9px; font-style: normal; }
      .screen { min-height: calc(100vh - 56px); padding-bottom: 64px; }
      .queue-layout { display: block; min-height: 0; }
      .queue-pane { position: static; height: auto; min-height: calc(100vh - 120px); overflow: visible; border-right: 0; }
      .queue-head { padding: 30px 20px 21px; }
      .queue-head h1 { font-size: 28px; }
      .tabs { padding-inline: 10px; }
      .queue-tools { padding: 16px 20px; }
      .queue-row { padding-inline: 17px 20px; }
      .day-divider { padding-inline: 20px; }
      .detail-pane { display: none; }
      .screen.mobile-detail .queue-pane { display: none; }
      .screen.mobile-detail .detail-pane { display: block; }
      .detail-inner { padding: 15px 20px 110px; }
      .back-button { display: inline-flex; min-height: 44px; align-items: center; margin: 0 0 18px -8px; padding: 0 8px; border: 0; background: transparent; color: #526353; font-size: 12.5px; font-weight: 650; }
      .detail-title h2 { font-size: 27px; }
      .detail-actions { align-items: stretch; }
      .detail-actions .primary-button { flex: 1 1 100%; }
      .facts { gap: 17px; }
      .menu-layout { display: block; }
      .menu-tools { padding-inline: 20px; }
      .menu-row { padding-inline: 17px 20px; }
      .menu-detail-inner { padding-bottom: 150px; }
      .menu-savebar { position: fixed; right: 0; bottom: 64px; left: 0; margin: 0; padding: 10px 20px; box-shadow: 0 -5px 22px #20272310; }
      .menu-savebar span { display: none; }
      .menu-savebar div { width: 100%; }
      .menu-savebar div button { flex: 1; }
      .toast { right: 12px; bottom: 78px; left: 12px; max-width: none; }
    }
    @media (max-width: 420px) {
      .queue-tools { grid-template-columns: minmax(0,1fr) 113px; }
      .facts, .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: 1; }
      .edit-line { grid-template-columns: minmax(0,1fr) 124px; }
      .edit-line .text-button { grid-column: 1/-1; justify-self: start; }
      .menu-price-row { grid-template-columns: 1fr; }
      .photo-control { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <svg class="sr-only" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ico-orders" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 8h8M8 12h6"/></symbol>
    <symbol id="ico-bookings" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15h3"/></symbol>
    <symbol id="ico-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h12"/></symbol>
    <symbol id="ico-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></symbol>
  </svg>
  <div class="shell">
    <aside class="primary" aria-label="Основная навигация">

      function toast(message) { const el = $("#toast"); el.textContent = message; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3200); }
      function ask(title, copy, action, acceptLabel = title.replace(/\?$/, "")) { pendingConfirm = action; $("#confirm-title").textContent = title; $("#confirm-copy").textContent = copy; $("#confirm-accept").textContent = acceptLabel; $("#confirm-dialog").showModal(); }

        const counts = { orders: orders.filter((order) => order.status === "new").length, bookings: bookings.filter((booking) => booking.status === "new").length };

        if (next !== view && orderEditing && JSON.stringify(orderDraft) !== JSON.stringify(orders.find((order) => order.id === selectedOrder)?.items)) {

          return;

        if (next !== view && menuDirty) {

          return;

        if (next !== view && view === "menu") menuCreating = false;
        view = next;
        orderEditing = false;

        if (next === "menu") renderMenu();

        const dirtyOrder = orderEditing && JSON.stringify(orderDraft) !== JSON.stringify(orders.find((order) => order.id === selectedOrder)?.items);
        if (!menuDirty && !dirtyOrder) return;
        event.preventDefault();
        ask("Отменить правки?", "Несохранённые изменения не сохранятся.", () => { menuDirty = false; orderEditing = false; window.location.href = link.href; }, "Не сохранять");

      window.addEventListener("beforeunload", (event) => {
        const dirtyOrder = orderEditing && JSON.stringify(orderDraft) !== JSON.stringify(orders.find((order) => order.id === selectedOrder)?.items);
        if (!menuDirty && !dirtyOrder) return;
        event.preventDefault();
        event.returnValue = "";
      });
      $$('.tabs').forEach((group) => group.addEventListener("keydown", (event) => {
        const tabs = $$('[role="tab"]', group);
        const current = tabs.indexOf(document.activeElement);
        if (current < 0) return;
        const next = event.key === "ArrowRight" ? (current + 1) % tabs.length : event.key === "ArrowLeft" ? (current - 1 + tabs.length) % tabs.length : event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : -1;
        if (next < 0) return;
        event.preventDefault(); tabs[next].focus(); tabs[next].click();
      }));
      function visibleOrders() {
        const needle = $("#order-search").value.trim().toLocaleLowerCase("ru-RU");

        return orders.filter((order) => {
          const current = !["delivered", "issued", "cancelled"].includes(order.status);
          if (orderFilter === "current" && !current) return false;
          if (orderFilter === "new" && order.status !== "new") return false;
          if (orderFilter === "history" && current) return false;
          if (type !== "all" && order.type !== type) return false;
          return !needle || [String(order.number), order.customer, order.phone].some((part) => part.toLocaleLowerCase("ru-RU").includes(needle));
        }).sort((a,b) => orderFilter === "history" ? Number(b.number) - Number(a.number) : (a.status === "new" ? 0 : 1) - (b.status === "new" ? 0 : 1) || Number(a.number) - Number(b.number));

      function renderOrders() {
        updateBadges();
        $("#orders-current-count").textContent = orders.filter((order) => !["delivered", "issued", "cancelled"].includes(order.status)).length;

      showView(["orders", "bookings", "menu"].includes(window.location.hash.slice(1)) ? window.location.hash.slice(1) : "orders");
    })();
  </script>
</body>
</html>
